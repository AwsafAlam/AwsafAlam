<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Malaysia Trip">
<meta name="theme-color" content="#1B2A4A">
<title>Malaysia Trip 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0f1923;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.login-wrap{
  width:100%;max-width:380px;padding:24px;
  animation:fadeUp .6s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{
  text-align:center;margin-bottom:40px;
}
.logo-icon{
  width:72px;height:72px;
  background:linear-gradient(135deg,#0D7377,#1B2A4A);
  border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:36px;
  box-shadow:0 8px 32px rgba(13,115,119,0.35);
  margin-bottom:16px;
}
.logo h1{
  color:#F5ECD7;font-size:22px;font-weight:700;
  letter-spacing:0.5px;
}
.logo p{
  color:rgba(245,236,215,0.5);font-size:13px;margin-top:4px;
}
.field{
  position:relative;margin-bottom:20px;
}
.field input{
  width:100%;padding:16px 52px 16px 18px;
  background:rgba(245,236,215,0.08);
  border:1.5px solid rgba(245,236,215,0.12);
  border-radius:12px;
  color:#F5ECD7;font-size:16px;
  outline:none;
  transition:border .2s,background .2s;
}
.field input:focus{
  border-color:#0D7377;
  background:rgba(245,236,215,0.12);
}
.field input::placeholder{color:rgba(245,236,215,0.35)}
.toggle-pw{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(245,236,215,0.4);
  font-size:20px;cursor:pointer;padding:4px;
  -webkit-tap-highlight-color:transparent;
}
.toggle-pw:active{color:rgba(245,236,215,0.7)}
.btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#0D7377,#0a5c5f);
  color:#F5ECD7;font-size:16px;font-weight:600;
  border:none;border-radius:12px;cursor:pointer;
  letter-spacing:0.3px;
  transition:transform .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:0.5;cursor:wait}
.error{
  color:#E8604C;font-size:13px;text-align:center;
  margin-top:12px;min-height:20px;
  transition:opacity .2s;
}
.spinner{
  display:inline-block;width:18px;height:18px;
  border:2px solid rgba(245,236,215,0.3);
  border-top-color:#F5ECD7;border-radius:50%;
  animation:spin .6s linear infinite;
  vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{
  text-align:center;margin-top:48px;
  color:rgba(245,236,215,0.25);font-size:11px;
}
.decrypting-overlay{
  position:fixed;inset:0;
  background:#0f1923;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
  z-index:9999;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
.decrypting-overlay.active{opacity:1;pointer-events:all}
.decrypting-overlay .spinner{width:32px;height:32px;border-width:3px}
.decrypting-overlay p{color:rgba(245,236,215,0.6);font-size:14px}
</style>
</head>
<body>

<div class="decrypting-overlay" id="overlay">
  <span class="spinner"></span>
  <p>Decrypting your travel guide...</p>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="logo">
    <div class="logo-icon">✈️</div>
    <h1>Malaysia 2026</h1>
    <p>Travel Companion</p>
  </div>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <input type="password" id="pw" placeholder="Enter password" autocomplete="off" autofocus>
      <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">👁</button>
    </div>
    <button type="submit" class="btn" id="submitBtn">Unlock</button>
    <div class="error" id="error"></div>
  </form>
  <div class="footer">AES-256-GCM encrypted &middot; Your data stays private</div>
</div>

const $ = id => document.getElementById(id);

$('togglePw').addEventListener('click', () => {
  const inp = $('pw');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  $('togglePw').textContent = inp.type === 'password' ? '\u{1F441}' : '\u{1F648}';
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value;
  if (!pw) { $('error').textContent = 'Please enter a password'; return; }

  $('submitBtn').disabled = true;
  $('submitBtn').innerHTML = '<span class="spinner"></span>Decrypting...';
  $('error').textContent = '';

  // small delay so UI updates before heavy crypto
  await new Promise(r => setTimeout(r, 50));

  try {
    const data = JSON.parse(PAYLOAD);
    const salt = Uint8Array.from(atob(data.s), c => c.charCodeAt(0));
    const nonce = Uint8Array.from(atob(data.n), c => c.charCodeAt(0));
    const ct = Uint8Array.from(atob(data.c), c => c.charCodeAt(0));

    const keyMaterial = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: data.i, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: nonce }, key, ct
    );
    const html = new TextDecoder().decode(decrypted);

    $('overlay').classList.add('active');
    $('loginWrap').style.display = 'none';

    await new Promise(r => setTimeout(r, 400));

    document.open();
    document.write(html);
    document.close();

  } catch (err) {
    $('error').textContent = 'Wrong password. Try again.';
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = 'Unlock';
    $('pw').focus();
    $('pw').select();
  }
});
</script>
